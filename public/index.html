<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Receipt Scanner</title>
  <style>
    body { font-family: sans-serif; max-width: 560px; margin: 20px auto; padding: 0 16px; }
    img { max-width: 100%; margin: 12px 0; }
    label { display: block; margin-top: 10px; font-size: 14px; }
    input[type=text], input[type=number] { width: 100%; padding: 6px; box-sizing: border-box; }
    button { padding: 10px 16px; margin-top: 12px; }
    .summary { display: flex; gap: 12px; flex-wrap: wrap; }
    .summary div { border: 1px solid #ccc; padding: 10px; flex: 1; min-width: 110px; }
    .summary b { display: block; font-size: 20px; }
    .row { border-bottom: 1px solid #ddd; padding: 8px 0; font-size: 14px; }
    .row button { margin: 0 0 0 8px; padding: 2px 8px; }
  </style>
</head>
<body>
  <h2>Receipt Scanner</h2>
  <div class="summary" id="summary"></div>

  <h3>Scan a receipt</h3>
  <input type="file" id="file" accept="image/*" capture="environment">
  <br><img id="preview" style="display:none">
  <button id="scan" style="display:none">Read receipt</button>
  <p id="status"></p>
  <div id="result"></div>
  <button id="saveBtn" style="display:none">Save receipt</button>

  <h3>Saved receipts</h3>
  <div id="list"></div>

  <script>
    const fileInput = document.getElementById("file");
    const preview = document.getElementById("preview");
    const scanBtn = document.getElementById("scan");
    const saveBtn = document.getElementById("saveBtn");
    const statusEl = document.getElementById("status");
    const resultEl = document.getElementById("result");
    let imageBase64 = null;
    let current = null;

    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const fmt = (n) => (Number(n) || 0).toFixed(2);

    function resizeImage(file, maxSize = 1600) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
          const canvas = document.createElement("canvas");
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL("image/jpeg", 0.85));
        };
        img.src = URL.createObjectURL(file);
      });
    }

    fileInput.onchange = async () => {
      const file = fileInput.files[0];
      if (!file) return;
      const dataUrl = await resizeImage(file);
      imageBase64 = dataUrl.split(",")[1];
      preview.src = dataUrl;
      preview.style.display = "block";
      scanBtn.style.display = "inline-block";
      saveBtn.style.display = "none";
      resultEl.innerHTML = "";
      statusEl.textContent = "";
    };

    scanBtn.onclick = async () => {
      statusEl.textContent = "Reading receipt...";
      scanBtn.disabled = true;
      try {
        const res = await fetch("/api/scan", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ image: imageBase64 }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        current = data;
        statusEl.textContent = "Check the details below, fix anything wrong, then save.";
        showResult(data);
        saveBtn.style.display = "inline-block";
      } catch (e) {
        statusEl.textContent = e.message;
      }
      scanBtn.disabled = false;
    };

    saveBtn.onclick = async () => {
      const val = (id) => document.getElementById(id).value.trim();
      const num = (id) => (val(id) === "" ? null : Number(val(id)));
      const record = {
        store: val("store"),
        date: val("date") || null,
        total: num("total"),
        gst: num("gst"),
        total_savings: num("savings"),
        points_earned: num("points"),
        points_balance: num("balance"),
        loyalty_program: val("program") || null,
        offers: current.offers || [],
        items: current.items || [],
      };
      await fetch("/api/receipts", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(record),
      });
      resultEl.innerHTML = "";
      saveBtn.style.display = "none";
      scanBtn.style.display = "none";
      preview.style.display = "none";
      fileInput.value = "";
      statusEl.textContent = "Saved.";
      loadReceipts();
    };

    function field(label, id, value, type = "text") {
      return `<label>${label}<input type="${type}" step="any" id="${id}" value="${esc(value)}"></label>`;
    }

    function showResult(d) {
      resultEl.innerHTML =
        field("Store", "store", d.store) +
        field("Date", "date", d.date) +
        field("Total spent", "total", d.total, "number") +
        field("GST", "gst", d.gst, "number") +
        field("Total savings", "savings", d.total_savings, "number") +
        field("Points earned", "points", d.points_earned, "number") +
        field("Points balance", "balance", d.points_balance, "number") +
        field("Loyalty program", "program", d.loyalty_program) +
        `<label>Offers applied</label><ul>${(d.offers || []).map((o) => `<li>${esc(o)}</li>`).join("") || "<li>None found</li>"}</ul>` +
        `<label>Items</label><ul>${(d.items || []).map((i) => `<li>${esc(i.name)}: ${esc(i.price)}</li>`).join("")}</ul>`;
    }

    async function loadReceipts() {
      const list = await (await fetch("/api/receipts")).json();
      const sum = (k) => list.reduce((a, r) => a + (Number(r[k]) || 0), 0);
      document.getElementById("summary").innerHTML =
        `<div>Total spent<b>$${fmt(sum("total"))}</b></div>` +
        `<div>Total saved<b>$${fmt(sum("total_savings"))}</b></div>` +
        `<div>Points earned<b>${sum("points_earned")}</b></div>` +
        `<div>Receipts<b>${list.length}</b></div>`;
      document.getElementById("list").innerHTML =
        list.map((r) =>
          `<div class="row">${esc(r.store)} | ${esc(r.date || "no date")} | $${fmt(r.total)}` +
          (r.total_savings ? ` | saved $${fmt(r.total_savings)}` : "") +
          (r.points_earned ? ` | ${esc(r.points_earned)} pts` : "") +
          `<button onclick="del('${esc(r.id)}')">Delete</button></div>`
        ).join("") || "<p>No receipts saved yet.</p>";
    }

    async function del(id) {
      await fetch("/api/receipts/" + id, { method: "DELETE" });
      loadReceipts();
    }

    loadReceipts();
  </script>
</body>
</html>
