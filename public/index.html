<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recept</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#1a1d23;--muted:#6b7280;--line:#e5e7eb;--accent:#0f766e;--accent-text:#fff;--bar:#99d5cf}
@media (prefers-color-scheme:dark){:root{--bg:#111418;--card:#1b1f26;--text:#e8eaed;--muted:#9aa3af;--line:#2b313a;--accent:#2dd4bf;--accent-text:#0b1f1d;--bar:#1f6f66}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
h1{font-size:20px;margin:0;padding:14px 0 6px}
.tabs{display:flex;gap:4px}
.tab{flex:1;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);font-size:15px;font-weight:600;padding:10px 0;cursor:pointer}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
main{max-width:640px;margin:0 auto;padding:16px}
.panel{display:none}
.panel.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card h2{font-size:16px;margin:0 0 12px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat span{display:block;font-size:12px;color:var(--muted)}
.stat b{display:block;font-size:19px;margin-top:4px}
.stat.hero{grid-column:1/-1;padding:16px}
.stat.hero b{font-size:32px}
.drop{display:block;border:2px dashed var(--line);border-radius:12px;padding:28px 12px;text-align:center;color:var(--muted);cursor:pointer}
.drop:hover{border-color:var(--accent);color:var(--accent)}
img{max-width:100%;border-radius:10px;margin-top:12px}
button.primary{width:100%;margin-top:12px;padding:12px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-text);font-size:16px;font-weight:600;cursor:pointer}
button.primary:disabled{opacity:.6;cursor:wait}
#status{color:var(--muted);font-size:14px;margin:10px 0 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid .full{grid-column:1/-1}
.grid label{font-size:12px;color:var(--muted)}
.grid input{width:100%;margin-top:4px;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font-size:15px}
details{margin-top:12px;font-size:14px}
summary{cursor:pointer;color:var(--muted)}
details ul{margin:8px 0 0;padding-left:20px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.row:last-child{border-bottom:0}
.muted{color:var(--muted);font-size:13px}
.del{background:none;border:0;color:var(--muted);cursor:pointer;font-size:13px}
.del:hover{color:#dc2626}
.chart{display:flex;align-items:flex-end;gap:8px;height:170px}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.col .bar{width:100%;background:var(--bar);border-radius:6px 6px 0 0}
.col .v{font-size:11px;margin-bottom:3px}
.col small{font-size:11px;color:var(--muted);margin-top:6px;white-space:nowrap}
.hbar{height:8px;background:var(--bar);border-radius:4px;margin-top:6px}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>Recept</h1>
  <nav class="tabs">
    <button class="tab active" data-tab="scan">Scan</button>
    <button class="tab" data-tab="spending">Spending</button>
    <button class="tab" data-tab="savings">Savings</button>
  </nav>
</div></header>

<main>
  <section id="scan" class="panel active">
    <div class="card">
      <h2>Add a receipt</h2>
      <label class="drop" for="file">Tap to take or upload a photo</label>
      <input type="file" id="file" accept="image/*" capture="environment" hidden>
      <img id="preview" hidden>
      <button class="primary" id="scan-btn" hidden>Read receipt</button>
      <p id="status"></p>
    </div>
    <div class="card" id="result-card" hidden>
      <h2>Check the details</h2>
      <div id="result"></div>
      <button class="primary" id="saveBtn">Save receipt</button>
    </div>
    <div class="card">
      <h2>Recent</h2>
      <div id="recent"></div>
    </div>
  </section>

  <section id="spending" class="panel">
    <div class="stats" id="stats-spending"></div>
    <div class="card"><h2>Spending by month</h2><div id="chart"></div></div>
    <div class="card"><h2>All receipts</h2><div id="list"></div></div>
  </section>

  <section id="savings" class="panel">
    <div class="stats" id="stats-savings"></div>
    <div class="card"><h2>Savings by store</h2><div id="by-store"></div></div>
    <div class="card"><h2>Points</h2><div id="points"></div></div>
    <div class="card"><h2>Offers used</h2><div id="offers"></div></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = (n) => "$" + (Number(n) || 0).toLocaleString("en-AU", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const monthKey = (d) => (d && /^\d{4}-\d{2}/.test(d) ? d.slice(0, 7) : "Unknown");
const monthLabel = (k) => (k === "Unknown" ? k : MONTHS[Number(k.slice(5, 7)) - 1] + " " + k.slice(2, 4));
const sum = (arr, k) => arr.reduce((a, r) => a + (Number(r[k]) || 0), 0);
const empty = '<p class="muted">Nothing here yet.</p>';

let imageBase64 = null;
let current = null;
let receipts = [];

/* ---------- tabs ---------- */
document.querySelectorAll(".tab").forEach((b) => {
  b.onclick = () => {
    document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("active", x === b));
    document.querySelectorAll(".panel").forEach((p) => p.classList.toggle("active", p.id === b.dataset.tab));
  };
});

/* ---------- scanning ---------- */
function resizeImage(file, maxSize = 1600) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
      const canvas = document.createElement("canvas");
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
      resolve(canvas.toDataURL("image/jpeg", 0.85));
    };
    img.src = URL.createObjectURL(file);
  });
}

$("file").onchange = async () => {
  const f = $("file").files[0];
  if (!f) return;
  const url = await resizeImage(f);
  imageBase64 = url.split(",")[1];
  $("preview").src = url;
  $("preview").hidden = false;
  $("scan-btn").hidden = false;
  $("result-card").hidden = true;
  $("status").textContent = "";
};

$("scan-btn").onclick = async () => {
  const btn = $("scan-btn");
  $("status").textContent = "Reading receipt...";
  btn.disabled = true;
  try {
    const res = await fetch("/api/scan", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ image: imageBase64 }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    current = data;
    showResult(data);
    $("result-card").hidden = false;
    $("status").textContent = "Check the details, fix anything wrong, then save.";
    $("result-card").scrollIntoView({ behavior: "smooth" });
  } catch (e) {
    $("status").textContent = e.message;
  }
  btn.disabled = false;
};

function field(label, id, value, type = "text", full = false) {
  return `<div class="${full ? "full" : ""}"><label>${label}<input type="${type}" step="any" id="${id}" value="${esc(value)}"></label></div>`;
}

function showResult(d) {
  const offers = d.offers || [];
  const items = d.items || [];
  $("result").innerHTML =
    `<div class="grid">` +
    field("Store", "store", d.store, "text", true) +
    field("Date", "date", d.date) +
    field("Total spent", "total", d.total, "number") +
    field("GST", "gst", d.gst, "number") +
    field("Total savings", "savings", d.total_savings, "number") +
    field("Points earned", "points", d.points_earned, "number") +
    field("Points balance", "balance", d.points_balance, "number") +
    field("Loyalty program", "program", d.loyalty_program, "text", true) +
    `</div>` +
    `<details><summary>Offers applied (${offers.length})</summary><ul>${offers.map((o) => `<li>${esc(o)}</li>`).join("") || "<li>None found</li>"}</ul></details>` +
    `<details><summary>Items (${items.length})</summary><ul>${items.map((i) => `<li>${esc(i.name)}: ${esc(i.price)}</li>`).join("")}</ul></details>`;
}

$("saveBtn").onclick = async () => {
  const val = (id) => $(id).value.trim();
  const num = (id) => (val(id) === "" ? null : Number(val(id)));
  const record = {
    store: val("store"),
    date: val("date") || null,
    total: num("total"),
    gst: num("gst"),
    total_savings: num("savings"),
    points_earned: num("points"),
    points_balance: num("balance"),
    loyalty_program: val("program") || null,
    offers: current.offers || [],
    items: current.items || [],
  };
  await fetch("/api/receipts", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(record),
  });
  $("result-card").hidden = true;
  $("scan-btn").hidden = true;
  $("preview").hidden = true;
  $("file").value = "";
  $("status").textContent = "Saved.";
  await loadReceipts();
};

/* ---------- dashboard ---------- */
const stat = (label, value, hero) => `<div class="stat${hero ? " hero" : ""}"><span>${label}</span><b>${value}</b></div>`;

const rowHtml = (r, del) =>
  `<div class="row"><div><b>${esc(r.store || "Unknown store")}</b><div class="muted">${esc(r.date || "No date")}</div></div>` +
  `<div style="display:flex;align-items:center;gap:12px;text-align:right"><div><b>${money(r.total)}</b>` +
  (Number(r.total_savings) ? `<div class="muted">saved ${money(r.total_savings)}</div>` : "") +
  `</div>${del ? `<button class="del" data-del="${esc(r.id)}">Delete</button>` : ""}</div></div>`;

function render() {
  const list = receipts;
  const spent = sum(list, "total");
  const saved = sum(list, "total_savings");
  const pts = sum(list, "points_earned");
  const now = new Date();
  const nowKey = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0");
  const thisMonth = sum(list.filter((r) => monthKey(r.date) === nowKey), "total");

  const offers = [];
  list.forEach((r) => (r.offers || []).forEach((o) => offers.push({ o, store: r.store })));

  // scan tab
  $("recent").innerHTML = list.slice(0, 3).map((r) => rowHtml(r, false)).join("") || empty;

  // spending tab
  $("stats-spending").innerHTML =
    stat("Total spent", money(spent), true) +
    stat("This month", money(thisMonth)) +
    stat("Receipts", list.length) +
    stat("Average", money(list.length ? spent / list.length : 0));

  const byMonth = {};
  list.forEach((r) => {
    const k = monthKey(r.date);
    if (k !== "Unknown") byMonth[k] = (byMonth[k] || 0) + (Number(r.total) || 0);
  });
  const keys = Object.keys(byMonth).sort().slice(-12);
  if (!keys.length) {
    $("chart").innerHTML = empty;
  } else {
    const W = 600, H = 220, L = 34, R = 34, T = 28, B = 30;
    const max = Math.max(...keys.map((k) => byMonth[k]), 1);
    const x = (i) => (keys.length === 1 ? W / 2 : L + (i * (W - L - R)) / (keys.length - 1));
    const y = (v) => T + (1 - v / max) * (H - T - B);
    const pts = keys.map((k, i) => x(i) + "," + y(byMonth[k])).join(" ");
    const grid = [0, 0.5, 1].map((f) => `<line x1="${L}" x2="${W - R}" y1="${y(max * f)}" y2="${y(max * f)}" stroke-width="1" style="stroke:var(--line)"/>`).join("");
    const dots = keys.map((k, i) =>
      `<circle cx="${x(i)}" cy="${y(byMonth[k])}" r="4" style="fill:var(--accent)"/>` +
      `<text x="${x(i)}" y="${y(byMonth[k]) - 10}" text-anchor="middle" font-size="12" style="fill:var(--text)">$${Math.round(byMonth[k])}</text>` +
      `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="12" style="fill:var(--muted)">${monthLabel(k)}</text>`
    ).join("");
    $("chart").innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${grid}<polyline points="${pts}" fill="none" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" style="stroke:var(--accent)"/>${dots}</svg>`;
  }

  $("list").innerHTML = list.map((r) => rowHtml(r, true)).join("") || empty;

  // savings tab
  const rate = spent + saved > 0 ? Math.round((saved / (spent + saved)) * 100) + "%" : "0%";
  $("stats-savings").innerHTML =
    stat("Total saved", money(saved), true) +
    stat("Points earned", pts.toLocaleString("en-AU")) +
    stat("Savings rate", rate) +
    stat("Offers used", offers.length);

  const byStore = {};
  list.forEach((r) => {
    const s = r.store || "Unknown store";
    byStore[s] = (byStore[s] || 0) + (Number(r.total_savings) || 0);
  });
  const stores = Object.entries(byStore).filter((e) => e[1] > 0).sort((a, b) => b[1] - a[1]);
  const smax = stores.length ? stores[0][1] : 1;
  $("by-store").innerHTML = stores.map((e) =>
    `<div style="margin-bottom:12px"><div class="row" style="padding:0;border:0"><span>${esc(e[0])}</span><b>${money(e[1])}</b></div>` +
    `<div class="hbar" style="width:${Math.round((e[1] / smax) * 100)}%"></div></div>`).join("") || empty;

  const progs = {};
  list.forEach((r) => {
    const p = r.loyalty_program || "No program";
    if (!progs[p]) progs[p] = { earned: 0, balance: null };
    progs[p].earned += Number(r.points_earned) || 0;
    if (progs[p].balance === null && r.points_balance != null) progs[p].balance = r.points_balance;
  });
  $("points").innerHTML = Object.entries(progs)
    .filter((e) => e[1].earned > 0 || e[1].balance !== null)
    .map((e) =>
      `<div class="row"><span>${esc(e[0])}</span><span style="text-align:right"><b>${e[1].earned.toLocaleString("en-AU")} earned</b>` +
      (e[1].balance !== null ? `<div class="muted">latest balance ${esc(e[1].balance)}</div>` : "") +
      `</span></div>`).join("") || empty;

  $("offers").innerHTML = offers.slice(0, 30).map((x) =>
    `<div class="row"><span>${esc(x.o)}</span><span class="muted">${esc(x.store)}</span></div>`).join("") || empty;
}

async function loadReceipts() {
  receipts = await (await fetch("/api/receipts")).json();
  render();
}

document.addEventListener("click", async (e) => {
  const b = e.target.closest("[data-del]");
  if (!b) return;
  if (!confirm("Delete this receipt?")) return;
  await fetch("/api/receipts/" + b.dataset.del, { method: "DELETE" });
  loadReceipts();
});

loadReceipts();
</script>
</body>
</html>
